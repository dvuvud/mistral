<div class="inactive-users-container">
    <mat-list>
        @for (user of allUsers(); track user.id; let last = $last) { <!--håller koll på id-->
        <mat-list-item>
            <span matListItemTitle>
                {{user.name}} <!--safe -> ? ??-->
            </span>
            @if (user.active) {
            <button matListItemMeta mat-raised-button color="mat-sys-primary" (click)="inactivateUser(user.id)">
                <mat-icon>cancel</mat-icon>
                Inaktivera
            </button>
            }
            @if (!user.active) {
            <button matListItemMeta mat-raised-button color="mat-sys-primary" (click)="activateUser(user.id)">
                <mat-icon>check</mat-icon>
                Aktivera
            </button>
            }
        </mat-list-item>
        @if (!last) {
        <mat-divider></mat-divider>
        }
        }

    </mat-list>

</div>
