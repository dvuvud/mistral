<mat-form-field>
  <main-caret-tracker #tracker [filter]="contentSignal() === 'groupView' ? groupSignal().id : childSignal().id" [isGroup]="contentSignal() === 'groupView' ? 'yes' : ''" [journalScrollTop]="journalScrollTop()"></main-caret-tracker>
  <textarea #journalContent matInput
    [ngModel]="text()"
    (scroll)="onScroll()"
    (window:resize)="onResize()"
    (input)="onInput($event)"></textarea>
</mat-form-field>
