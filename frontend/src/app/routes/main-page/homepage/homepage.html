<mat-card class="main-card">
    <mat-card-header class="school-title">
            <p>Kändpersonsnamn Förskola</p>
    </mat-card-header>
    <mat-divider></mat-divider>
    <mat-card-content class="main-body">
        <mat-card class="news">
    <mat-card-header class="news-header">
        <p>
            <mat-icon>newspaper</mat-icon>
            Nyheter
        </p>
    </mat-card-header>
    <mat-divider></mat-divider>
        <mat-card-content class="news-content">
          @for (number of [1, 2, 3, 4, 5]; track number) {
            <mat-card class="mock-news-boxes">
                <p class="news-text">
                    <span class="news-title">CLICKBAIT TITEL</span>
                    {{number === 1 || number === 4 ? fakeNewsLong : fakeNews}}
                </p>
            </mat-card>
          }
        </mat-card-content>
        </mat-card>
        <mat-card class="staff">
            <mat-card-header class="news-header">
                <p>
                    <mat-icon>diversity_3</mat-icon>
                    Personal
                </p>
            </mat-card-header>
            <mat-divider></mat-divider>
            <mat-card-content class="news-content">
              @for (teacher of users(); track teacher.id) {
                <mat-card class="mock-teachers">
                    <mat-icon>face</mat-icon>
                    <p class="namn" >{{teacher.name}}</p>
                </mat-card>
              }
            </mat-card-content>
        </mat-card>
    </mat-card-content>
</mat-card>
